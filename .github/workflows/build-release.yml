name: Build release artifact

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - name: Install pinned PDF dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-drawings.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build and verify release
        run: python build_release.py

      - name: Upload generated release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tang-primer-20k-case-r4-${{ github.sha }}
          path: build/artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
